[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectordb"
version = "2.0.0"
description = "VectorDB & RAG engine — Python port of main.cpp"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[project.scripts]
vectordb-server = "vectordb.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vectordb*"]
